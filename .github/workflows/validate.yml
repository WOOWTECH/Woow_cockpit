name: Validate deployment source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lab tests bind engine files of named commits (git ls-tree/show of that history)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Backup engine tools (age, zstd), Home Assistant backup crypto (PyNaCl, cryptography) and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age zstd python3-nacl python3-cryptography
          age --version
          zstd --version
          # setup-python's interpreter cannot see apt packages: the versions Ubuntu 24.04 ships, from PyPI.
          # PyYAML: the LiteLLM connection probe reads the proxy's config inside its container; a test runs that probe here.
          python3 -m pip install pynacl==1.5.0 cryptography==41.0.7 pyyaml==6.0.1
          python3 -c 'import nacl, cryptography, yaml; print("PyNaCl", nacl.__version__, "cryptography", cryptography.__version__, "PyYAML", yaml.__version__)'
      - name: Installer and source contracts
        env:
          WOOWBK_REQUIRE_HA_CRYPTO: '1'
        run: |
          python3 -m unittest discover -s tests -t . -v
          python3 scripts/check_source.py
          bash -n scripts/bootstrap-ubuntu.sh scripts/build-podman.sh
          node --check native/podman/managed-owners.js
          node --check branding/mobile-navigation.js
          node --check tests/mobile-navigation-live.mjs
          node --check tests/parallel-ingress-live.mjs
          node --check apps-catalog/theme.js
          node --check apps-catalog/apps.js
          node --check apps-catalog/stacks.js
          node --test tests/stack-plans.mjs
          node --check scripts/capture.mjs
          node --check services/service.js
          node --check backup/backup.js
          node --check pi-web-integration/gateway.mjs
          node --check pi-web-integration/package/app.js
          node --test pi-web-integration/tests/*.mjs
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Shared ownership and reference gallery tests
        run: node --test tests/managed-owners.mjs && node tests/preview.mjs
      - name: Both installed brands - applications, services, backup and Pi themes
        run: node tests/brand-browser.mjs
      - name: Both brands - PWA browser installation fixtures
        run: node tests/pwa-brands.mjs
