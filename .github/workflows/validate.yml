name: Validate deployment source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Backup engine tools (age, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age zstd
          age --version
          zstd --version
      - name: Installer and source contracts
        run: |
          python3 -m unittest discover -s tests -t . -v
          python3 scripts/check_source.py
          bash -n scripts/bootstrap-ubuntu.sh scripts/build-podman.sh
          node --check native/podman/managed-owners.js
          node --check branding/mobile-navigation.js
          node --check tests/mobile-navigation-live.mjs
          node --check apps-catalog/theme.js
          node --check apps-catalog/apps.js
          node --check apps-catalog/stacks.js
          node --test tests/stack-plans.mjs
          node --check scripts/capture.mjs
          node --check services/service.js
          node --check backup/backup.js
          node --check pi-web-integration/gateway.mjs
          node --check pi-web-integration/package/app.js
          node --test pi-web-integration/tests/gateway.mjs
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Gallery, service management and backup browser tests
        run: npm test
      - name: Application catalogue browser tests
        run: node tests/apps-catalog.mjs
      - name: Pi Web embedded theme browser tests
        run: node tests/embedded-theme.mjs
