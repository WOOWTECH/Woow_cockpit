worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    # Pi Web's Next.js build uses root-relative assets, API and router paths.
    # Cockpit packages stay under /cockpit/. Root document/RSC requests from
    # the Pi iframe go to Pi; a top-level root navigation still opens Cockpit.
    map "$uri|$http_sec_fetch_dest|$http_rsc" $pi_request {
        default 0;
        ~^/cockpit/ 0;
        ~^/woow-pwa/ 0;
        ~^/pi-web(?:/|\|) 1;
        ~^/(?:api|_next|icons|paseo-web)(?:/|\|) 1;
        ~^/(?:login|omnigent|paseo/setup|favicon\.ico|manifest\.webmanifest|sw\.js|__woow_cockpit_theme\.js)\| 1;
        ~\|iframe\| 1;
        ~\|1$ 1;
    }
    server {
        listen 127.0.0.1:29091;
        server_name _;
        location /woow-pwa/ {
            alias /opt/woow-pwa/;
            types { application/manifest+json webmanifest; image/png png; }
            add_header Cache-Control 'no-cache';
        }
        location / {
            error_page 418 = @piweb;
            if ($pi_request) { return 418; }
            proxy_pass http://127.0.0.1:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding '';
            proxy_read_timeout 3600s;
            sub_filter_once on;
            sub_filter '</head>' '<link rel="manifest" href="/woow-pwa/manifest.webmanifest"><meta name="theme-color" content="#6183fc"><link rel="apple-touch-icon" href="/woow-pwa/icon-192.png"></head>';
        }
        location @piweb {
            rewrite ^/pi-web/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:19095;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
