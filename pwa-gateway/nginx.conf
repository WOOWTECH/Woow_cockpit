worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    server {
        listen 127.0.0.1:29091;
        server_name _;
        location /woow-pwa/ {
            alias /opt/woow-pwa/;
            types { application/manifest+json webmanifest; image/png png; }
            add_header Cache-Control 'no-cache';
        }
        location / {
            proxy_pass http://127.0.0.1:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding '';
            proxy_read_timeout 3600s;
            sub_filter_once on;
            sub_filter '</head>' '<link rel="manifest" href="/woow-pwa/manifest.webmanifest"><meta name="theme-color" content="#6183fc"><link rel="apple-touch-icon" href="/woow-pwa/icon-192.png"></head>';
        }
    }
}
